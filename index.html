@keyframes mvJump{0%{transform:translateY(40px) scale(.6,.5);opacity:0}40%{transform:translateY(-26px) scale(.95,1.08);opacity:1}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0) scale(1)}}
@keyframes mvWiggle{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-5deg) translateY(-6px)}40%{transform:rotate(5deg) translateY(0)}60%{transform:rotate(-3deg) translateY(-4px)}80%{transform:rotate(0)}}
